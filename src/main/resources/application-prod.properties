# Production Profile Configuration
# Activate with: java -jar app.jar --spring.profiles.active=prod

# Production Logging (minimal)
logging.level.com.acn.holidayapi=INFO
logging.level.org.springframework.web=WARN
server.error.include-stacktrace=never
server.error.include-exception=false

# SSL (use proper certificates in production)
ssl.insecure-mode=false

# Security
server.error.whitelabel.enabled=false

# Swagger (disable in real production, keep for assessment)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}

# Cache (larger in production)
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=2h