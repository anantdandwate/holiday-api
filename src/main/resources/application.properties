# Holiday API Configuration
spring.application.name=holiday-api

# External API
nager.date.api.base-url=https://date.nager.at/api/v3

# Server configuration
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Logging
logging.level.root=INFO
logging.level.com.acn.holidayapi=DEBUG
logging.level.org.springframework.web=INFO
logging.level.reactor.netty=INFO
logging.level.org.springframework.web.servlet.resource=ERROR
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO

# SSL Truststore configuration (used by WebClientConfig)
ssl.truststore.path=certs/truststore.jks
ssl.truststore.password=changeit
ssl.insecure-mode=false

# Error Handling
server.error.include-stacktrace=on_param
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=false

# Static Resources
spring.web.resources.add-mappings=false


# Cache configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=1h
spring.cache.cache-names=holidays

# Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Connection Pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# Environment Configuration
spring.config.import=optional:file:.env[.properties]